<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <title>HÓC MÔN - THU TIÊM PHÒNG</title>
</head>
<style>
  body { font-family: sans-serif; background-color: #f8f9fa; }
  .container-sm { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  label { width: 100%; font-weight: 500; font-size: 0.85em; margin-bottom: 2px;}
  input[type="number"], input[type="text"] { width: 100%; margin-bottom: 15px; }
  .section-title { color: #d9534f; border-bottom: 2px solid #d9534f; padding-bottom: 5px; margin-top: 20px; margin-bottom: 15px; font-size: 1.1em; font-weight: bold; }
  .results-group h5 { color: #0056b3; margin-top: 1rem; border-bottom: 2px solid #0056b3; padding-bottom: 5px; }
  .total-row input { font-weight: bold; color: red; }
  .results-summary { background-color: #e9ecef; padding: 20px 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-top: 20px; }
  .results-summary label { font-weight: bold; color: #495057; }
  .results-summary input[disabled] { font-weight: bold; color: #0056b3; background-color: #fff; opacity: 1; cursor: default; }
</style>
<body>
  <div class="container-sm mt-3">
    <h3 class="mb-3 text-center" style="color:RED; font-weight: bold;">
      TÍNH ĐƠN VỊ VẬT NUÔI & CHI PHÍ TIÊM PHÒNG<br>
      <small class="text-muted" style="font-size: 0.5em;">(Thông tư 94/2025/TT-BNNMT & NQ 64/2025/NQ-HĐND TP.HCM)</small>
    </h3>
    
    <!-- I. LỢN -->
    <div class="section-title">🐷 I. Lợn</div>
    <div class="row">
      <div class="col-md-2 col-sm-4"><label>Lợn < 28 ngày</label><input id="heo_duoi28" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Thịt (Nội)</label><input id="heo_thit_noi" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Thịt (Ngoại)</label><input id="heo_thit_ngoai" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Nái (Nội)</label><input id="heo_nai_noi" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Nái (Ngoại)</label><input id="heo_nai_ngoai" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Lợn đực</label><input id="heo_duc" type="number" min="0" oninput="sumOfNbr()"></div>
    </div>

    <!-- II. GIA CẦM -->
    <div class="section-title">🐔 II. Gia cầm</div>
    <div class="row">
      <div class="col-md-3 col-sm-6"><label>Gà nội</label><input id="ga_noi" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Gà CN (Hướng thịt)</label><input id="ga_cn_thit" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Gà CN (Hướng trứng)</label><input id="ga_cn_trung" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Đà điểu</label><input id="dadieu" type="number" min="0" oninput="sumOfNbr()"></div>
      
      <div class="col-md-3 col-sm-6"><label>Vịt H.thịt (Nội)</label><input id="vit_thit_noi" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Vịt H.thịt (Ngoại)</label><input id="vit_thit_ngoai" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Vịt H.trứng</label><input id="vit_trung" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Chim cút</label><input id="cut" type="number" min="0" oninput="sumOfNbr()"></div>

      <div class="col-md-3 col-sm-4"><label>Ngan</label><input id="ngan" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-4"><label>Ngỗng</label><input id="ngong" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-4"><label>Bồ câu</label><input id="bocau" type="number" min="0" oninput="sumOfNbr()"></div>
    </div>

    <!-- III. BÒ & IV. TRÂU -->
    <div class="section-title">🐮 III. Bò & IV. Trâu</div>
    <div class="row">
      <div class="col-md-3 col-sm-6"><label>Bê < 6 tháng</label><input id="be_duoi6" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Bò thịt (Nội)</label><input id="bo_thit_noi" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Bò thịt (Ngoại/Lai)</label><input id="bo_thit_ngoai" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Bò sữa</label><input id="bo_sua" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Nghé < 6 tháng</label><input id="nghe" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Trâu</label><input id="trau" type="number" min="0" oninput="sumOfNbr()"></div>
    </div>

    <!-- V. GIA SÚC KHÁC & VI. ĐỘNG VẬT KHÁC -->
    <div class="section-title">🐐 V. Gia súc khác & VI. Động vật khác</div>
    <div class="row">
      <div class="col-md-2 col-sm-4"><label>Ngựa</label><input id="ngua" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Dê</label><input id="de" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Cừu</label><input id="cuu" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Thỏ</label><input id="tho" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Hươu sao</label><input id="huou" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-2 col-sm-4"><label>Dông</label><input id="dong" type="number" min="0" oninput="sumOfNbr()"></div>
    </div>
    
    <div class="row mt-2">
      <div class="col-md-3 col-sm-6"><label>Chó (< 5kg)</label><input id="cho_1" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Chó (5 - < 20kg)</label><input id="cho_2" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Chó (20 - < 50kg)</label><input id="cho_3" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Chó (>= 50kg)</label><input id="cho_4" type="number" min="0" oninput="sumOfNbr()"></div>
      <div class="col-md-3 col-sm-6"><label>Vịt trời</label><input id="vittroi" type="number" min="0" oninput="sumOfNbr()"></div>
    </div>

    <!-- TỔNG HỢP QUY MÔ -->
    <div class="row results results-summary">
      <div class="col-lg-3 col-sm-6"><label>TỔNG GIA SÚC:</label><input id="sum2" type="text" class="form-control" disabled></div>
      <div class="col-lg-3 col-sm-6"><label>TỔNG GIA CẦM:</label><input id="sum3" type="text" class="form-control" disabled></div>
      <div class="col-lg-3 col-sm-6"><label>TỔNG CHÓ:</label><input id="sum4" type="text" class="form-control" disabled></div>
      <div class="col-lg-3 col-sm-6"><label>ĐƠN VỊ VẬT NUÔI:</label><input id="sum" type="text" class="form-control text-danger" disabled></div>
      
      <div class="col-lg-4 mt-2"><label>QUY MÔ CHĂN NUÔI:</label><input id="gsthucnuoi1" type="text" class="form-control" disabled></div>
      <div class="col-lg-8 mt-2"><label>CHÍNH SÁCH NQ 64/2025/NQ-HĐND:</label><input id="thutientp" type="text" class="form-control text-danger" disabled></div>
    </div>
    
    <!-- TÍNH CHI PHÍ TIÊM PHÒNG -->
    <div class="results-group">
      <h5>🐷 Heo</h5>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá FMD:</label><input id="fmd1" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="fmd1_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="fmd1_total" type="text" class="form-control" disabled></div>
      </div>
      
      <h5>🐐 Dê Cừu</h5>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá FMD:</label><input id="fmd4" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="fmd4_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="fmd4_total" type="text" class="form-control" disabled></div>
      </div>
      
      <h5>🐮 Trâu Bò</h5>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá FMD:</label><input id="fmd2" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="fmd2_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="fmd2_total" type="text" class="form-control" disabled></div>
      </div>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá THT:</label><input id="tht2" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="tht2_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="tht2_total" type="text" class="form-control" disabled></div>
      </div>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá VDNC:</label><input id="vdnc2" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="vdnc2_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="vdnc2_total" type="text" class="form-control" disabled></div>
      </div>

      <h5>🐔🦆 Gia Cầm</h5>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá Cúm GC:</label><input id="cgc" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="cgc_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="cgc_total" type="text" class="form-control" disabled></div>
      </div>

      <h5>🐕 Chó</h5>
      <div class="row">
        <div class="col-md-4 col-12"><label>Đơn giá Dại:</label><input id="dai" type="text" class="form-control" disabled></div>
        <div class="col-md-4 col-12"><label>Số lượng tiêm:</label><input id="dai_qty" type="number" class="form-control" min="0" oninput="sumOfNbr()"></div>
        <div class="col-md-4 col-12"><label>Thành tiền:</label><input id="dai_total" type="text" class="form-control" disabled></div>
      </div>
    </div>
    <hr>
    
    <div class="row my-4 justify-content-end total-row">
        <div class="col-md-5 col-12">
            <label style="color:red; font-size: 1.2em;">TỔNG CỘNG THU:</label>
            <input id="grand_total" type="text" class="form-control text-right" disabled style="font-size: 1.5em; background: #fff3f3;">
        </div>
    </div>
  </div>

<script>
  function printResults(result) {
    Object.keys(result).forEach(key => {
      if (document.getElementById(key)) {
        document.getElementById(key).value = result[key];
      }
    });
  }
  
  function sumOfNbr() {
    const getValue = id => Number(document.getElementById(id).value) || 0;
    
    // --- 1. TÍNH ĐƠN VỊ VẬT NUÔI (Chính xác 100% theo Thông tư 94) ---
    const dvn = {
      heo_duoi28: getValue("heo_duoi28") * 0.016, heo_thit_noi: getValue("heo_thit_noi") * 0.16, heo_thit_ngoai: getValue("heo_thit_ngoai") * 0.2, heo_nai_noi: getValue("heo_nai_noi") * 0.4, heo_nai_ngoai: getValue("heo_nai_ngoai") * 0.5, heo_duc: getValue("heo_duc") * 0.6,
      
      ga_noi: getValue("ga_noi") * 0.003, ga_cn_thit: getValue("ga_cn_thit") * 0.005, ga_cn_trung: getValue("ga_cn_trung") * 0.0036, vit_thit_noi: getValue("vit_thit_noi") * 0.0036, vit_thit_ngoai: getValue("vit_thit_ngoai") * 0.005, vit_trung: getValue("vit_trung") * 0.003, ngan: getValue("ngan") * 0.0056, ngong: getValue("ngong") * 0.008, cut: getValue("cut") * 0.0003, bocau: getValue("bocau") * 0.0012, dadieu: getValue("dadieu") * 0.16, vittroi: getValue("vittroi") * 0.003,

      be_duoi6: getValue("be_duoi6") * 0.2, bo_thit_noi: getValue("bo_thit_noi") * 0.34, bo_thit_ngoai: getValue("bo_thit_ngoai") * 0.7, bo_sua: getValue("bo_sua") * 1.0, nghe: getValue("nghe") * 0.24, trau: getValue("trau") * 0.7,

      ngua: getValue("ngua") * 0.4, de: getValue("de") * 0.05, cuu: getValue("cuu") * 0.06, tho: getValue("tho") * 0.005, huou: getValue("huou") * 0.1, dong: getValue("dong") * 0.000, 
      
      cho_1: getValue("cho_1") * 0.0055, cho_2: getValue("cho_2") * 0.025, cho_3: getValue("cho_3") * 0.07, cho_4: getValue("cho_4") * 0.12
    };

    const sum = Object.values(dvn).reduce((a, b) => a + b, 0);
    document.getElementById("sum").value = Math.round(sum * 10000) / 10000;

    // --- 2. TÍNH TỔNG ĐÀN ---
    const totalHeo = getValue("heo_duoi28") + getValue("heo_thit_noi") + getValue("heo_thit_ngoai") + getValue("heo_nai_noi") + getValue("heo_nai_ngoai") + getValue("heo_duc");
    const totalTrauBo = getValue("be_duoi6") + getValue("bo_thit_noi") + getValue("bo_thit_ngoai") + getValue("bo_sua") + getValue("nghe") + getValue("trau");
    const totalDeCuu = getValue("de") + getValue("cuu");
    const totalGiaCam = getValue("ga_noi") + getValue("ga_cn_thit") + getValue("ga_cn_trung") + getValue("vit_thit_noi") + getValue("vit_thit_ngoai") + getValue("vit_trung") + getValue("ngan") + getValue("ngong") + getValue("cut") + getValue("bocau") + getValue("dadieu") + getValue("vittroi");
    const totalCho = getValue("cho_1") + getValue("cho_2") + getValue("cho_3") + getValue("cho_4");
    const totalGiaSuc = totalHeo + totalTrauBo + totalDeCuu + getValue("ngua") + getValue("tho") + getValue("huou");

    document.getElementById("sum2").value = totalGiaSuc.toLocaleString('vi-VN');
    document.getElementById("sum3").value = totalGiaCam.toLocaleString('vi-VN');
    document.getElementById("sum4").value = totalCho.toLocaleString('vi-VN');

    // --- 3. KIỂM TRA LOGIC SỐ LƯỢNG TIÊM ---
    function validateQuantity(inputId, max, animalName) {
        const inputElement = document.getElementById(inputId);
        if (getValue(inputId) > max) {
            alert(`⚠️ Số lượng tiêm (${getValue(inputId)}) không được lớn hơn tổng đàn ${animalName} (${max}).`);
            inputElement.value = max;
        }
    }
    
    validateQuantity('fmd1_qty', totalHeo, 'Heo'); validateQuantity('fmd4_qty', totalDeCuu, 'Dê Cừu'); validateQuantity('fmd2_qty', totalTrauBo, 'Trâu Bò'); validateQuantity('tht2_qty', totalTrauBo, 'Trâu Bò'); validateQuantity('vdnc2_qty', totalTrauBo, 'Trâu Bò'); validateQuantity('cgc_qty', totalGiaCam, 'Gia Cầm'); validateQuantity('dai_qty', totalCho, 'Chó');

    // --- 4. ÁP DỤNG CHÍNH SÁCH THEO NGHỊ QUYẾT 64/2025/NQ-HĐND TP.HCM ---
    // NQ 64 quy định: Hỗ trợ 100% cho Nông hộ (Dưới 10 ĐVN). Trang trại (từ 10 ĐVN trở lên) tự chi trả 100%.
    if (sum === 0) {
      printResults({ gsthucnuoi1: '', thutientp: '', fmd1: '', fmd2: '', fmd4: '', tht2: '', vdnc2: '', cgc: '', dai: '' });
    } else if (sum < 10) {
      // Dưới 10 ĐVN: Chăn nuôi Nông Hộ -> Miễn phí hoàn toàn
      printResults({ gsthucnuoi1: 'Chăn nuôi Nông Hộ', thutientp: 'Hỗ trợ 100% kinh phí', fmd1: 'Miễn Phí', fmd2: 'Miễn Phí', fmd4: 'Miễn Phí', tht2: 'Miễn Phí', vdnc2: 'Miễn Phí', cgc: 'Miễn Phí', dai: 'Miễn Phí' });
    } else { 
      // Từ 10 ĐVN trở lên: Quy mô Trang trại -> Tự chi trả 100%
      let quyMo = 'Trang Trại Nhỏ';
      if (sum >= 30 && sum < 300) quyMo = 'Trang Trại Vừa';
      if (sum >= 300) quyMo = 'Trang Trại Lớn';
      
      printResults({ 
        gsthucnuoi1: quyMo, 
        thutientp: 'Chủ vật nuôi tự chi trả 100%', 
        fmd1: 'Thu 24.000đ', // Hãy sửa các giá này theo giá thu thực tế tại Hóc Môn
        fmd2: 'Thu 34.000đ', 
        fmd4: 'Thu 14.000đ', 
        tht2: 'Thu 11.000đ', 
        vdnc2: 'Thu 35.000đ', 
        cgc: 'Thu 600đ', 
        dai: 'Thu 20.000đ' 
      });
    }

    // --- 5. TÍNH TỔNG TIỀN ---
    function parsePrice(priceString) {
      if (!priceString || priceString.toLowerCase().includes('miễn phí')) return 0;
      return Number(priceString.replace(/\D/g, ''));
    }

    function formatCurrency(number) {
        if (isNaN(number) || number === 0) return '0 đ';
        return number.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
    }

    let grandTotal = 0;
    const vaccineTypes = ['fmd1', 'fmd4', 'fmd2', 'tht2', 'vdnc2', 'cgc', 'dai'];

    vaccineTypes.forEach(vaccine => {
        const priceString = document.getElementById(vaccine).value;
        const pricePerHead = parsePrice(priceString);
        const quantity = getValue(vaccine + '_qty');
        const totalCost = pricePerHead * quantity;
        grandTotal += totalCost;
        document.getElementById(vaccine + '_total').value = formatCurrency(totalCost);
    });

    document.getElementById('grand_total').value = formatCurrency(grandTotal);
  }

  window.onload = sumOfNbr;
</script>
</body>
</html>
